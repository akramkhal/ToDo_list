{% extends 'base.html' %}

{% block title %}Удаление задачи{% endblock %}

{% block content %}

    <h1>Удаление задачи</h1>

    <div class="card">
        <div class="card-body">
            <p>Вы действительно хотите удалить задачу "{{ task.description }}"?</p>
            <div class="d-flex gap-2">
                <form method="post">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-outline-danger">Да</button>
                </form>
                <a href="{% url 'task_view' task.pk %}" class="btn  btn-outline-success">Нет</a>
            </div>
        </div>
    </div>
{% endblock %}
